name: Quality Gate

# Read-only checks for pull requests and main. Deploys nothing and needs no secrets; the server
# deploy stays in server-deploy.yml. Branch protection is not changed by this file: making these
# jobs required is an owner decision in the repository settings.
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static gate (secrets, architecture, build hygiene, Claude config)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Only for parsing the workflow files themselves (config.claude check); pinned.
      - name: Install PyYAML
        run: python -m pip install --disable-pip-version-check --no-input pyyaml==6.0.2

      # Exit codes: 0 PASS, 1 FAIL, 3 INCOMPLETE (a required check could not run) - all non-zero fail the job.
      - name: Run quality gate (ci profile)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python scripts/quality/quality_gate.py --profile ci --base "origin/${BASE_REF:-main}"

  server-tests:
    name: Server tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # The same tests the Docker build runs before deploy (VT-AUD-080), now also on pull requests.
      - name: Run server tests
        run: |
          chmod +x gradlew
          ./gradlew :server:test --stacktrace
