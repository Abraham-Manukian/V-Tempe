name: Deploy Server to Cloud Run

on:
  push:
    branches: [ main ]
    # Every input of the server image (VT-AUD-081): sources, the shared test contracts, the
    # Gradle wrapper and version catalog, and the Docker build context rules.
    paths:
      - 'server/**'
      - 'testdata/**'
      - 'shared/src/commonMain/kotlin/com/vtempe/shared/domain/exercise/ExerciseLibrary.kt'
      - 'shared/src/commonMain/kotlin/com/vtempe/shared/domain/exercise/ExerciseBrowseCatalog.kt'
      - 'gradle/**'
      - 'gradlew'
      - 'Dockerfile'
      - '.dockerignore'
      - 'cloudbuild.yaml'
      - '.github/workflows/server-deploy.yml'

jobs:
  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The image build runs ./gradlew; its wrapper JAR must be an official Gradle release (VT-AUD-083).
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Submit Cloud Build
        run: |
          gcloud builds submit \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --config=cloudbuild.yaml \
            --substitutions=COMMIT_SHA=${{ github.sha }} \
            .
